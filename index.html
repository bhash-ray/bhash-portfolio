<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Bhash — Games</title>
<link rel="preconnect" href="https://fonts.googleapis.com">

<style>
:root{--bg:#000;--fg:#fafafa;--mute:#8d8d8d;--pad:clamp(16px,3vw,40px)}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){--bg:#000;--fg:#fafafa;--mute:#8d8d8d}}
:root[data-theme="dark"]{--bg:#000;--fg:#fafafa;--mute:#8d8d8d}
*,*::before,*::after{box-sizing:border-box}
body{margin:0;background:var(--bg);color:var(--fg);font:400 15px/1.4 "Inter Tight",system-ui,-apple-system,"Helvetica Neue",Arial,sans-serif}
body.lock{overflow:hidden}
button{font:inherit;color:inherit;background:none;border:0;padding:0;cursor:pointer;text-align:left}
a{color:inherit;text-decoration:none}
h1,h2,h3{margin:0;font-weight:500;letter-spacing:-.035em;line-height:1}
:focus-visible{outline:2px solid currentColor;outline-offset:3px}
.art{position:absolute;inset:0;overflow:hidden}
.art .bx{position:absolute;display:block}
.w{display:inline-block;overflow:hidden;vertical-align:top;padding:.05em 0 .12em}
.i{display:inline-block;transform:translateY(112%);transition:transform .9s cubic-bezier(.2,.75,.1,1)}
.in .i{transform:none}
/* top bar */
.top{position:fixed;top:0;left:0;right:0;z-index:36;display:flex;justify-content:space-between;align-items:center;padding:calc(18px + env(safe-area-inset-top,0px)) calc(var(--pad) + 112px) 0 var(--pad);color:#fff;mix-blend-mode:difference}
.logo{font:500 28px/1 "Fredoka","Nunito","Varela Round",system-ui,sans-serif;letter-spacing:0}
.tl{display:flex;align-items:center;gap:22px}
.top .back{display:none}
body.pg .top .back{display:flex}
.top nav{display:flex;gap:clamp(16px,2.4vw,34px)}
.top a:hover,.top button:hover{text-decoration:underline;text-underline-offset:4px}
.resume{position:fixed;z-index:50;top:calc(11px + env(safe-area-inset-top,0px));right:var(--pad);background:#2a52be;color:#fff;padding:7px 16px;border-radius:30px;font-size:14px;font-weight:500;transition:background .25s,color .25s,transform .25s}
.resume:hover{background:#1f3f94;color:#fff;transform:translateY(-1px)}
/* banner: separated depth layers, no characters */
.banner{position:relative;height:100vh;height:100dvh;overflow:hidden;background:#000;color:#fff}
.ly{position:absolute;inset:-8% -6%;will-change:transform}
.ly .bx{position:absolute;display:block}
.sky{background:#000}
.bt{position:absolute;left:var(--pad);right:var(--pad);bottom:clamp(90px,20vh,220px);z-index:3;will-change:transform}
.bt h1{font-size:clamp(48px,9.5vw,168px);margin:0 0 16px}
.bt p{margin:0;max-width:34ch;font-size:clamp(14px,1.15vw,18px)}
.scr{position:absolute;z-index:6;right:var(--pad);bottom:clamp(24px,5vh,56px);font-size:13px}
/* statement */
.say{position:relative;height:165vh}
.pin{position:sticky;top:0;height:100vh;height:100dvh;display:grid;place-items:center;padding:0 clamp(20px,8vw,140px)}
.say small{position:absolute;top:calc(84px + env(safe-area-inset-top,0px));left:0;right:0;text-align:center;color:var(--mute);font-size:13px}
.say p{margin:0;text-align:center;max-width:19em;font:500 clamp(28px,4.9vw,78px)/1.1 "Inter Tight",system-ui,sans-serif;letter-spacing:-.035em}
.t{display:inline;opacity:.14;transition:opacity .45s}
.t.on{opacity:1}
.t.em{font-style:italic;font-weight:400}
/* divider */
.div{display:grid;place-items:center;text-align:center;padding:26vh var(--pad) 7vh}
.div h2{font-size:clamp(44px,10vw,170px)}
.div #dsub{display:block;margin-top:18px;font-size:14px;color:var(--mute)}
/* works carousel */
.works{position:relative;padding:0 0 12vh;overflow:hidden;scroll-margin-top:76px}
.wh{display:flex;justify-content:space-between;align-items:center;margin:0 var(--pad) 1.5vh;font-size:14px;color:var(--mute);gap:16px}
.roll{display:flex;align-items:center;gap:12px;background:#000;border:1px solid #3a3a3a;color:#fff;border-radius:40px;padding:7px 18px 7px 12px;font-size:14px;transition:transform .25s,background .25s}
.roll:hover{background:#222;transform:translateY(-1px)}
.rd{--s:22px;position:relative;width:26px;height:26px;display:grid;place-items:center;perspective:220px}
.rd .die{animation:spin 6s linear infinite}
@keyframes spin{from{transform:rotateX(-26deg) rotateY(-34deg)}to{transform:rotateX(-26deg) rotateY(326deg)}}
.car{--W:max(300px,min(68vw,1200px,calc((100vh - 330px) * 1.7778)));position:relative;height:calc(var(--W) * .5625 + 30px);perspective:1800px;touch-action:pan-y;user-select:none;cursor:grab}
.car.drag{cursor:grabbing}
.card{position:absolute;left:50%;top:10px;width:var(--W);aspect-ratio:16/9;margin-left:calc(var(--W) / -2);color:#fff;will-change:transform}
.tilt{position:absolute;inset:0;border-radius:4px;overflow:hidden;background:#111;box-shadow:0 2px 8px rgba(0,0,0,.18)}
.vid .bx{animation:dr 7s ease-in-out infinite alternate}
.vid .bx:nth-child(2){animation-delay:-1.4s}.vid .bx:nth-child(3){animation-delay:-2.8s}.vid .bx:nth-child(4){animation-delay:-4.2s}.vid .bx:nth-child(5){animation-delay:-5.6s}
@keyframes dr{to{transform:translate(3%,2.5%) scale(1.07)}}
.tilt video{position:absolute;inset:0;width:100%;height:100%;object-fit:cover}
.tc,.kind{position:absolute;top:12px;font-size:12px;z-index:2;padding:3px 9px;border-radius:20px;background:rgba(0,0,0,.45)}
.tc{left:12px}.kind{right:12px}
.nav{position:absolute;z-index:40;top:calc(10px + var(--W) * .28);width:44px;height:44px;border:1px solid currentColor;border-radius:50%;display:grid;place-items:center;background:var(--bg);transition:background .25s,color .25s}
.nav:hover{background:var(--fg);color:var(--bg)}
.nav svg{width:18px;height:18px;fill:none;stroke:currentColor;stroke-width:1.5}
.nav.p{left:var(--pad)}.nav.n{right:var(--pad)}
@media (max-width:760px){.nav{width:36px;height:36px}.roll span:last-child{display:none}.roll{padding:7px 10px}}
.dots{display:flex;justify-content:center;gap:10px;margin-top:14px}
.dots button{width:10px;height:10px;border-radius:50%;background:var(--mute);opacity:.4;transition:opacity .3s,background .3s}
.dots button.on{opacity:1;background:var(--fg)}
.desc{margin:16px auto 0;padding:0 var(--pad);max-width:720px;text-align:center}
.desc h3{font-size:clamp(22px,2.4vw,36px);margin-bottom:8px}
.desc p{margin:0 auto 12px;max-width:52ch;font-size:15px;color:var(--mute)}
.tags{display:flex;flex-wrap:wrap;gap:6px;justify-content:center;margin-bottom:12px}
.tags span{font-size:12px;padding:2px 10px;border:1px solid var(--fg);border-radius:20px}
.open{font-size:14px;border-bottom:1px solid var(--fg);padding-bottom:1px}
/* roll overlay */
.rollov{position:fixed;inset:0;z-index:60;display:grid;place-items:center;perspective:1000px}
.dim{position:absolute;inset:0;background:rgba(0,0,0,.62)}
.rname{position:fixed;z-index:65;text-align:center;color:#000;font:500 15px/1.1 "Inter Tight",system-ui,sans-serif;letter-spacing:-.03em;pointer-events:none;padding:0 7%}
.blob{position:fixed;z-index:70;border-radius:50%;background:#000;pointer-events:none}
/* footer */
.ft{background:#0b0b0b;color:#fff;padding:12vh var(--pad) 12vh}
.ft .fk{font-size:14px;color:#9a9a9a}
.ft>.nx{margin-bottom:34px}
.ft .big{display:block;margin:0 0 22px;font:500 clamp(28px,4.6vw,76px)/1 "Inter Tight",system-ui,sans-serif;letter-spacing:-.04em;word-break:break-word}
.ft .big:hover{text-decoration:underline;text-underline-offset:.1em}
.ft .links{display:flex;flex-wrap:wrap;gap:8px clamp(20px,2.6vw,36px);margin:0 0 34px}
.ft .links a{font-size:clamp(24px,2.6vw,38px);letter-spacing:-.02em;color:#e6e6e6;border-bottom:1px solid #555;padding-bottom:2px;transition:border-color .25s,color .25s}
.ft .links a:hover{color:#fff;border-color:#fff}
.ft p{max-width:40ch;color:#c8c8c8;margin:0 0 26px}
.nx{display:inline-block;border:1px solid var(--fg);border-radius:30px;padding:9px 20px;font-size:14px;transition:background .25s,color .25s}
.nx:hover{background:var(--fg);color:var(--bg)}
.ft .nx{border-color:#fff;color:#fff}.ft .nx:hover{background:#fff;color:#000}
.fbar{display:flex;justify-content:space-between;gap:20px;flex-wrap:wrap;margin-top:12vh;padding-top:18px;border-top:1px solid #2e2e2e;font-size:13px;color:#9a9a9a}
.fbar nav{display:flex;gap:22px;flex-wrap:wrap}
.fbar a:hover,.fbar button:hover{color:#fff}
/* flip overlay (card -> project) */
.fl{position:fixed;inset:0;z-index:40;perspective:1200px;pointer-events:none}
.fc{position:absolute;transform-style:preserve-3d}
.ff,.fz{position:absolute;inset:0;overflow:hidden;backface-visibility:hidden;background:#111;color:#fff}
.ff{border-radius:4px}.fz{transform:rotateY(180deg)}
/* project + about pages */
#proj{position:fixed;inset:0;z-index:30;overflow-y:auto;background:var(--bg);visibility:hidden;opacity:0}
#proj.on{visibility:visible;opacity:1}
.back{display:flex;align-items:center;gap:8px;font-size:15px}
.back svg{width:18px;height:18px;fill:none;stroke:currentColor;stroke-width:1.6}
.hero{position:relative;height:100dvh;background:#000;color:#fff;overflow:hidden}
.ttl{position:absolute;left:var(--pad);right:var(--pad);bottom:clamp(24px,6vh,64px)}
.ttl h1{font-size:clamp(46px,9vw,160px);margin:10px 0 14px}
.ttl>span{display:block;font-size:14px}
.toc{position:fixed;left:var(--pad);top:50%;transform:translateY(-50%);width:min(24vw,290px);z-index:25;transition:opacity .4s}
.toc.off{opacity:0;pointer-events:none}
.toc button{display:block;width:100%;padding:5px 0;font:500 clamp(18px,1.7vw,26px)/1.1 "Inter Tight",system-ui,sans-serif;letter-spacing:-.03em;color:var(--mute);transition:color .25s}
.toc button.a{color:var(--fg)}
.toc p{margin:0;max-height:0;overflow:hidden;opacity:0;font:400 13px/1.35 "Inter Tight",system-ui,sans-serif;letter-spacing:0;color:var(--fg);transition:max-height .4s,opacity .3s}
.toc button:hover p,.toc button:focus-visible p{max-height:5em;opacity:1;padding-top:6px}
.body{display:grid;grid-template-columns:minmax(0,3fr) minmax(0,6fr) minmax(0,3fr);padding:0 var(--pad)}
.sec{grid-column:2;padding:clamp(64px,13vh,130px) 0 0}
.sec.wide{grid-column:2 / 4}
.nohero{padding-top:clamp(70px,10vh,110px)}
.sec:last-child{padding-bottom:14vh}
.sec h2{font-size:clamp(32px,4.2vw,64px);margin-bottom:20px}
.sec p{margin:0 0 16px;max-width:54ch;font-size:16px}
dl{display:grid;grid-template-columns:repeat(4,auto);justify-content:start;gap:8px 36px;margin:26px 0 0;font-size:14px}
dt{color:var(--mute)}dd{margin:2px 0 0}
.tri{display:grid;grid-template-columns:repeat(3,1fr);gap:10px;margin-top:22px}
.tri div{border:1px solid var(--fg);border-radius:4px;padding:14px;min-height:120px;font-size:14px}
.tri b{display:block;font-weight:500;margin-bottom:6px}
table{width:100%;border-collapse:collapse;font-size:14px;margin-top:22px}
th,td{text-align:left;padding:11px 14px 11px 0;border-top:1px solid var(--fg);font-weight:400}
th{font-weight:500}
.og{display:grid;grid-template-columns:2fr 1fr;gap:10px;margin:22px 0 26px}
.im{position:relative;overflow:hidden;border-radius:4px;background:#111;min-height:110px}
.im.big{grid-row:span 2;aspect-ratio:16/9}
/* media: gameplay video + playable web build in the same screen */
.media{margin-top:8px}
.mbar{display:flex;align-items:center;gap:10px;flex-wrap:wrap;margin-bottom:14px}
.mbar .sp{flex:1}
.mt{padding:11px 20px;border-radius:40px;border:1px solid var(--fg);font-size:15px;transition:background .25s,color .25s}
.mt.on:not(.play){background:var(--fg);color:var(--bg)}
.mt.play{border:0;background:#2a52be;color:#fff;font-weight:500}
.mt.play:hover{background:#1f3f94}
.mt.play.on{box-shadow:0 0 0 2px var(--bg),0 0 0 4px #2a52be}
.itch{background:#2a52be;color:#fff;border-radius:4px;padding:8px 14px;font-size:14px;font-weight:500}
.fs{font-size:14px;border-bottom:1px solid var(--fg)}
.mscr{position:relative;aspect-ratio:16/9;border-radius:12px;overflow:hidden;background:#000;color:#fff}
.mscr .mv{position:absolute;inset:0}
.mscr video,.mscr iframe{position:absolute;inset:0;width:100%;height:100%;border:0;background:#000;object-fit:cover}
.mv .nm{position:absolute;left:0;right:0;top:34%;text-align:center;font:500 clamp(28px,5vw,72px)/1 "Inter Tight",system-ui,sans-serif;letter-spacing:-.04em}
.bigplay{position:absolute;left:50%;top:56%;width:88px;height:88px;margin:-44px 0 0 -44px;border-radius:50%;background:#2a52be;display:grid;place-items:center;transition:transform .25s}
.bigplay:hover{transform:scale(1.07)}
.bigplay svg{width:30px;height:30px;fill:#fff;margin-left:4px}
.mv .cap{position:absolute;left:0;right:0;bottom:6%;text-align:center;font-size:15px}
.hide{display:none!important}
/* about: image then text on its right; image flips on hover */
.two{display:grid;grid-template-columns:minmax(0,5fr) minmax(0,6fr);gap:clamp(20px,3.4vw,52px);align-items:start}
.flip{perspective:1000px;aspect-ratio:4/5;width:100%;max-width:420px;cursor:pointer;display:block}
.flip>span{position:absolute;inset:0;transform-style:preserve-3d;transition:transform .8s cubic-bezier(.2,.75,.15,1)}
.flip{position:relative}
.flip:hover>span,.flip:focus-visible>span,.flip.on>span{transform:rotateY(180deg)}
.flip i{position:absolute;inset:0;border-radius:4px;overflow:hidden;backface-visibility:hidden;background:#111;color:#fff;font-style:normal}
.flip i+i{transform:rotateY(180deg)}
.flip em{position:absolute;left:14px;bottom:12px;font-size:13px;font-style:normal;z-index:2}
@media (max-width:900px){.toc{display:none}.body{grid-template-columns:1fr}.sec,.sec.wide{grid-column:1}dl{grid-template-columns:repeat(2,auto)}.tri,.two{grid-template-columns:1fr}}
/* dice */
#ld{position:fixed;inset:0;z-index:100;background:#0b0b0b;display:grid;place-items:center;perspective:1000px;--s:clamp(34px,4vw,48px)}
.dc{position:relative;width:0;height:0;transform-style:preserve-3d}
.die{--h:calc(var(--s) / 2);position:absolute;left:calc(var(--s)/-2);top:calc(var(--s)/-2);width:var(--s);height:var(--s);transform-style:preserve-3d}
.f{position:absolute;inset:0;background:#fff;border:1px solid #c9c9c9;border-radius:16%;display:grid;grid-template:repeat(3,1fr)/repeat(3,1fr);padding:15%}
.f .p{width:64%;height:64%;border-radius:50%;background:#000;place-self:center}
.pdot{position:fixed;z-index:110;border-radius:50%;background:#000;pointer-events:none}
@media (prefers-reduced-motion:reduce){#ld{display:none}.i{transform:none;transition:none}.t{opacity:1}.vid .bx,.rd .die{animation:none}}
</style>
</head>
